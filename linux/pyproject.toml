# Single source of truth for the app version (read by blitztext/__init__.py
# and packaging/build-deb.sh). Kept as "2.03.72" (PEP 440 would normalise it
# to 2.3.72) to match existing tags and changelogs.
[project]
name = "blitztext"
version = "2.03.76"

[tool.coverage.run]
source = ["blitztext"]
relative_files = true

[tool.coverage.report]
skip_empty = true
